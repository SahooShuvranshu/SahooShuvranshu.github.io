<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: Not Found | Shuvranshu Portfolio</title>
    <meta name="description" content="This Discord channel or page does not exist.">
    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/u/70892515?v=4">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Centralized Modern Discord Stylesheets -->
    <link rel="stylesheet" href="/css/discord-theme.css">
    <link rel="stylesheet" href="/css/components.css">

    <style>
        .error-card {
            background-color: var(--bg-profile);
            border-radius: var(--radius-outer);
            max-width: 520px;
            width: 90%;
            padding: 40px 24px;
            text-align: center;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-popout);
            margin: auto;
        }

        .error-code {
            font-size: 72px;
            font-weight: 800;
            color: var(--blurple);
            line-height: 1;
            margin-bottom: 12px;
        }

        .error-title {
            color: var(--text-white);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .error-desc {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
    </style>
</head>

<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <div class="error-title">You've Discovered an Empty Channel</div>
        <div class="error-desc">
            The page or channel you're looking for seems to have vanished or been moved to a different server.
        </div>
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <a href="/" class="discord-btn discord-btn-primary">
                <i class="fa-solid fa-house"></i> Return to Home
            </a>
            <a href="/socials/" class="discord-btn discord-btn-secondary">
                <i class="fa-solid fa-share-nodes"></i> View Socials
            </a>
        </div>
    </div>
</body>

</html>
