<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
    <rect width="100%" height="100%" fill="#202225"/>
    <!-- Outer Discord Brutalist Border -->
    <rect x="12" y="12" width="576" height="316" fill="#2f3136" stroke="#40444b" stroke-width="3"/>
    <rect x="20" y="20" width="560" height="300" fill="none" stroke="#1DB954" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Top Channel / Category Header Pill -->
    <g transform="translate(36, 42)">
        <rect width="180" height="24" fill="#202225" stroke="#1DB954" stroke-width="1.5"/>
        <text x="90" y="16" dominant-baseline="middle" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#1DB954">API SERVICE • 2024</text>
    </g>

    <!-- Music Equalizer / Vinyl Graphic -->
    <g transform="translate(300, 130)">
        <!-- Disc Circle -->
        <circle cx="0" cy="0" r="38" fill="#18191c" stroke="#1DB954" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="18" fill="#2f3136" stroke="#40444b" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="6" fill="#1DB954"/>
        
        <!-- Sound Wave Bars Left -->
        <rect x="-85" y="-12" width="6" height="24" fill="#1DB954" rx="2"/>
        <rect x="-72" y="-22" width="6" height="44" fill="#1DB954" rx="2"/>
        <rect x="-59" y="-8" width="6" height="16" fill="#1DB954" rx="2"/>

        <!-- Sound Wave Bars Right -->
        <rect x="53" y="-15" width="6" height="30" fill="#1DB954" rx="2"/>
        <rect x="66" y="-26" width="6" height="52" fill="#1DB954" rx="2"/>
        <rect x="79" y="-10" width="6" height="20" fill="#1DB954" rx="2"/>
    </g>

    <!-- Title & Subtitle -->
    <text x="300" y="210" dominant-baseline="middle" text-anchor="middle" font-family="'Whitney', 'Helvetica Neue', Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="1">SPOTIFY LIVE BANNER</text>
    <text x="300" y="240" dominant-baseline="middle" text-anchor="middle" font-family="'Whitney', 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="500" fill="#b9bbbe">Dynamic Now Playing GitHub Banner &amp; Web Service</text>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(300, 282)">
        <text dominant-baseline="middle" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#1DB954">Python  •  Flask  •  Spotify API  •  Vercel</text>
    </g>
</svg>
