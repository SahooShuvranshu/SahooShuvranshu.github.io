<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
    <rect width="100%" height="100%" fill="#202225"/>
    <!-- Outer Discord Brutalist Border -->
    <rect x="12" y="12" width="576" height="316" fill="#2f3136" stroke="#40444b" stroke-width="3"/>
    <rect x="20" y="20" width="560" height="300" fill="none" stroke="#5865f2" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Top Channel / Category Header Pill -->
    <g transform="translate(36, 42)">
        <rect width="180" height="24" fill="#202225" stroke="#5865f2" stroke-width="1.5"/>
        <text x="90" y="16" dominant-baseline="middle" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#5865f2">WEB APPLICATION • 2024</text>
    </g>

    <!-- Newspaper / Editorial Center Artwork -->
    <g transform="translate(300, 130)">
        <!-- Newspaper Page -->
        <rect x="-42" y="-36" width="84" height="72" fill="#202225" stroke="#ffffff" stroke-width="2.5" rx="2"/>
        <!-- Fold line -->
        <line x1="-30" y1="-22" x2="30" y2="-22" stroke="#5865f2" stroke-width="3"/>
        <line x1="-30" y1="-10" x2="8" y2="-10" stroke="#b9bbbe" stroke-width="2"/>
        <line x1="-30" y1="-2" x2="25" y2="-2" stroke="#b9bbbe" stroke-width="2"/>
        <line x1="-30" y1="6" x2="20" y2="6" stroke="#b9bbbe" stroke-width="2"/>
        <line x1="-30" y1="14" x2="15" y2="14" stroke="#b9bbbe" stroke-width="2"/>
        <line x1="-30" y1="22" x2="30" y2="22" stroke="#5865f2" stroke-width="2"/>
        <!-- Star Accent -->
        <circle cx="24" cy="-10" r="5" fill="#faa61a"/>
    </g>

    <!-- Title & Subtitle -->
    <text x="300" y="210" dominant-baseline="middle" text-anchor="middle" font-family="'Whitney', 'Helvetica Neue', Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="1">YOUTH TIMES</text>
    <text x="300" y="240" dominant-baseline="middle" text-anchor="middle" font-family="'Whitney', 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="500" fill="#b9bbbe">Student-Led Online Newspaper &amp; Publishing Platform</text>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(300, 282)">
        <text dominant-baseline="middle" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#7289da">Flask  •  Python  •  HTML/CSS  •  Database</text>
    </g>
</svg>
