<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
    <rect width="100%" height="100%" fill="#202225"/>
    <!-- Outer Discord Brutalist Border -->
    <rect x="12" y="12" width="576" height="316" fill="#2f3136" stroke="#40444b" stroke-width="3"/>
    <rect x="20" y="20" width="560" height="300" fill="none" stroke="#00b0f4" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Top Channel / Category Header Pill -->
    <g transform="translate(36, 42)">
        <rect width="200" height="24" fill="#202225" stroke="#00b0f4" stroke-width="1.5"/>
        <text x="100" y="16" dominant-baseline="middle" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#00b0f4">DEVELOPER UTILITY • 2024</text>
    </g>

    <!-- Key & Token Generator Icon Artwork -->
    <g transform="translate(300, 130)">
        <!-- Lock / Token Shield -->
        <path d="M-30,-28 L30,-28 L38,10 L0,38 L-38,10 Z" fill="#202225" stroke="#00b0f4" stroke-width="2.5"/>
        <!-- Keyhole / Token Shape -->
        <circle cx="0" cy="-4" r="10" fill="#00b0f4"/>
        <polygon points="-4,-4 4,-4 6,18 -6,18" fill="#00b0f4"/>
    </g>

    <!-- Title & Subtitle -->
    <text x="300" y="210" dominant-baseline="middle" text-anchor="middle" font-family="'Whitney', 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="800" fill="#ffffff" letter-spacing="1">SPOTIFY TOKEN GENERATOR</text>
    <text x="300" y="240" dominant-baseline="middle" text-anchor="middle" font-family="'Whitney', 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="500" fill="#b9bbbe">Automated OAuth 2.0 Auth Flow &amp; Token Helper</text>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(300, 282)">
        <text dominant-baseline="middle" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#00b0f4">Python  •  Flask  •  OAuth 2.0  •  Spotify API</text>
    </g>
</svg>
