<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
    <rect width="100%" height="100%" fill="#202225"/>
    <!-- Outer Discord Brutalist Border -->
    <rect x="12" y="12" width="576" height="316" fill="#2f3136" stroke="#40444b" stroke-width="3"/>
    <rect x="20" y="20" width="560" height="300" fill="none" stroke="#faa61a" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Top Channel / Category Header Pill -->
    <g transform="translate(36, 42)">
        <rect width="210" height="24" fill="#202225" stroke="#faa61a" stroke-width="1.5"/>
        <text x="105" y="16" dominant-baseline="middle" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#faa61a">DATA SCIENCE &amp; ML • 2026</text>
    </g>

    <!-- AI Neural Network / Pipeline Graph -->
    <g transform="translate(300, 130)">
        <!-- Node connections -->
        <line x1="-50" y1="-20" x2="0" y2="-28" stroke="#40444b" stroke-width="2"/>
        <line x1="-50" y1="20" x2="0" y2="-28" stroke="#40444b" stroke-width="2"/>
        <line x1="-50" y1="-20" x2="0" y2="28" stroke="#40444b" stroke-width="2"/>
        <line x1="-50" y1="20" x2="0" y2="28" stroke="#40444b" stroke-width="2"/>
        <line x1="0" y1="-28" x2="50" y2="0" stroke="#faa61a" stroke-width="2.5"/>
        <line x1="0" y1="28" x2="50" y2="0" stroke="#faa61a" stroke-width="2.5"/>
        
        <!-- Input Layer -->
        <circle cx="-50" cy="-20" r="9" fill="#202225" stroke="#7289da" stroke-width="2"/>
        <circle cx="-50" cy="20" r="9" fill="#202225" stroke="#7289da" stroke-width="2"/>
        
        <!-- Hidden Layer -->
        <circle cx="0" cy="-28" r="10" fill="#202225" stroke="#5865f2" stroke-width="2.5"/>
        <circle cx="0" cy="28" r="10" fill="#202225" stroke="#5865f2" stroke-width="2.5"/>
        
        <!-- Output Node (Gold) -->
        <circle cx="50" cy="0" r="12" fill="#faa61a" stroke="#ffffff" stroke-width="2.5"/>
    </g>

    <!-- Title & Subtitle -->
    <text x="300" y="210" dominant-baseline="middle" text-anchor="middle" font-family="'Whitney', 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1">NEXT-GEN AI &amp; DATA SCIENCE</text>
    <text x="300" y="240" dominant-baseline="middle" text-anchor="middle" font-family="'Whitney', 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="500" fill="#b9bbbe">End-to-End Machine Learning &amp; Autonomous Agentic Pipelines</text>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(300, 282)">
        <text dominant-baseline="middle" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11.5" font-weight="700" fill="#faa61a">Python  •  Scikit-Learn  •  Pandas  •  LLMs  •  RAG</text>
    </g>
</svg>
